<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outlaw Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Outlaw Search</h1>
          <p>Загрузи файл, введи слово — найдём все совпадения</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="panel">
        <!-- Dropzone -->
        <div id="dropzone" class="dropzone" tabindex="0">
          <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.csv,.log,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.tsv,.ini,.conf,text/*" />
          <div class="dropzone-inner">
            <div class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <p class="dropzone-title">Перетащи файл сюда или <span class="link">выбери файл</span></p>
            <p class="dropzone-hint">Текстовые файлы: txt, md, csv, log, json, код и др.</p>
          </div>
        </div>

        <div id="fileMeta" class="file-meta" hidden>
          <div class="file-meta-left">
            <span class="file-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </span>
            <div>
              <span id="fileName" class="file-name"></span>
              <span id="fileInfo" class="file-info"></span>
            </div>
          </div>
          <button id="clearFile" class="btn-ghost" type="button">Убрать</button>
        </div>

        <!-- Search row -->
        <div class="search-row">
          <div class="search-input-wrap">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" id="query" class="search-input" placeholder="Введите слово для поиска…" autocomplete="off" disabled />
          </div>
          <div class="options">
            <label class="checkbox">
              <input type="checkbox" id="caseSensitive" />
              <span>Учитывать регистр</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" id="wholeWord" />
              <span>Слово целиком</span>
            </label>
            <label class="select-field">
              <span>Контекст</span>
              <select id="contextLines">
                <option value="0">без контекста</option>
                <option value="1">±1 строка</option>
                <option value="2" selected>±2 строки</option>
                <option value="3">±3 строки</option>
                <option value="5">±5 строк</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <!-- Results -->
      <section id="results" class="results" hidden>
        <div class="results-head">
          <div class="results-head-left">
            <h2>Результаты</h2>
            <span id="resultCount" class="count-pill"></span>
          </div>
          <div id="navBar" class="nav-bar" hidden>
            <button id="prevMatch" class="nav-btn" type="button" title="Предыдущее (Shift+Enter)" aria-label="Предыдущее совпадение">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span id="navCounter" class="nav-counter">0 / 0</span>
            <button id="nextMatch" class="nav-btn" type="button" title="Следующее (Enter)" aria-label="Следующее совпадение">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div id="resultsList" class="results-list"></div>
        <div id="emptyState" class="empty-state" hidden>
          <p>Ничего не найдено.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Outlaw Search — весь поиск происходит локально в браузере.</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
